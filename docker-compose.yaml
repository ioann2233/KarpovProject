services:
  app:
    build: ./app/
    env_file:
      - ./app/.env
    environment:
      DB_HOST: database
      DB_PORT: "5432"
    ports:
      - "8502:8501"
    volumes:
      - ./app:/app
    depends_on:
      - database
    networks:
      - ml-service-network

  web-proxy:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - ml-service-network

  database:
    image: postgres:16
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./app/.env
    networks:
      - ml-service-network

volumes:
  postgres_data:

networks:
  ml-service-network:
    driver: bridge
