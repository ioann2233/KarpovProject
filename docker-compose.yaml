services:
  app:
    build: ./app/
    env_file:
      - ./app/.env
    volumes:
      - ./app:/app
    depends_on:
      - database
      - rabbitmq
    networks:
      - ml-service-network

  web-proxy:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - ml-service-network

  rabbitmq:
    image: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    restart: on-failure
    networks:
      - ml-service-network

  database:
    image: postgres:16
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    env_file:
      - ./app/.env
    networks:
      - ml-service-network

networks:
  ml-service-network:
    driver: bridge
